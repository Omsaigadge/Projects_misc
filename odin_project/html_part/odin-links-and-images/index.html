<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Homepage</h1>
    <!-- This attribute is used to link other pages to the current html page -->
     <!-- href adds the link to the page -->
      <!-- target attribute makes sure that the link in the href is opened in a new tab and not in a current tab -->
       <!-- rel="noopener noreferrer" noopener ensures that the link clicked does get access to the actual document from which it was clicked while noreferrer makes sure that the links that are in the document do not know that their link is included in the document.  -->

       <!-- Below is an absolute link which means it points to an external webpage with a different domain name -->
    <a href="https://www.theodinproject.com/about" target="_blank" rel="noopener noreferrer">About the Odin Project</a>
        <!-- relative links as shown below point to pages in the same website -->
         <br>
    <a href="./pages/about.html">About Page</a>
    <br>
    <img src="./images/Hey-BU-Blog-Headers.jpg" alt="This should've been the crying cat" height="310" width="310">Cat1</img>

</body>
</html>
